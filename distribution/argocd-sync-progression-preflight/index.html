<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Argo CD Sync-Progression Preflight</title><style>body{font:15px system-ui;max-width:1100px;margin:auto;padding:2rem;color:#17202a}textarea{width:100%;min-height:16rem;font:12px monospace}input,button{padding:.65rem;margin:.25rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}pre{white-space:pre-wrap;background:#f4f6f7;padding:1rem}.BLOCK{color:#a00}.PASS{color:#087830}.REVIEW{color:#9a6500}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><h1>Argo CD Sync-Progression Preflight</h1><p>Local-only analysis of waves, hooks, SyncWindows, dependencies, and version-scoped progression hazards. Nothing is uploaded.</p><div class="grid"><label>Rendered manifests<textarea id="m"></textarea></label><label>Optional AppProject YAML<textarea id="p"></textarea></label></div><label>Current version <input id="c" placeholder="3.3.9"></label><label>Target version <input id="t" value="3.4.2"></label><button id="run">Analyze locally</button><button id="sample">Load blocked sample</button><button id="download">Download JSON</button><h2 id="status"></h2><pre id="out">Paste manifests and analyze.</pre><script type="module">import{analyze}from'./core.mjs';let last;const q=x=>document.getElementById(x);q('run').onclick=()=>{last=analyze({manifests:q('m').value,project:q('p').value,currentVersion:q('c').value,targetVersion:q('t').value});q('status').textContent=last.status;q('status').className=last.status;q('out').textContent=JSON.stringify(last,null,2)};q('sample').onclick=async()=>{q('m').value=await(await fetch('./sample/blocked.yaml')).text();q('c').value='3.3.9';q('t').value='3.4.2'};q('download').onclick=()=>{if(!last)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));a.download='argocd-sync-progression-evidence.json';a.click()};</script></html>
