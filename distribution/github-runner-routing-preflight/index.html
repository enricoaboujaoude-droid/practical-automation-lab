<title>GitHub Runner Routing Contract Preflight</title>
<style>body{font:16px system-ui;max-width:1100px;margin:36px auto;padding:0 20px;color:#17212b}textarea{width:100%;min-height:260px;font:13px ui-monospace,monospace;margin:6px 0 18px}button{padding:10px 16px;margin-right:8px}pre{white-space:pre-wrap;background:#f3f6f8;padding:16px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
<h1>GitHub runner routing contract preflight</h1>
