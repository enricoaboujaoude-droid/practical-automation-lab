<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Terraform Provider Upgrade Preflight</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 20px;color:#172033}h1{margin-bottom:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:650}input{display:block;margin-top:6px;width:100%}button{margin-top:20px;padding:10px 16px;background:#172033;color:white;border:0;border-radius:7px;font-weight:700}pre{white-space:pre-wrap;background:#f4f6f9;padding:16px;border-radius:8px}small{font-weight:400;color:#566}</style></head><body><h1>Terraform Provider-Upgrade Replacement Preflight</h1><p>Four files stay in this browser. No upload, credentials, backend, or telemetry.</p><div class="grid"><label>Baseline plan JSON<input id="bp" type="file" accept=".json"></label><label>Candidate plan JSON<input id="cp" type="file" accept=".json"></label><label>Baseline lockfile<input id="bl" type="file"></label><label>Candidate lockfile<input id="cl" type="file"></label></div><button id="run">Analyze and download evidence</button><pre id="out">Waiting for four files.</pre><script src="core.js"></script><script>const $=id=>document.getElementById(id),read=id=>$(id).files[0].text(),download=(name,text,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)};$('run').onclick=async()=>{try{for(const id of ['bp','cp','bl','cl'])if(!$(id).files[0])throw new Error('Choose all four files.');const report=TerraformUpgradePreflight.analyze({baselinePlan:await read('bp'),candidatePlan:await read('cp'),baselineLockfile:await read('bl'),candidateLockfile:await read('cl')});$('out').textContent=report.status+'\n'+JSON.stringify(report.summary,null,2);download('upgrade-preflight.json',JSON.stringify(report,null,2),'application/json');download('upgrade-preflight.html',TerraformUpgradePreflight.renderHtml(report),'text/html')}catch(e){$('out').textContent='ERROR: '+e.message}};</script></body></html>
