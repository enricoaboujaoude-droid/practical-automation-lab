name: PayanAgent settled demand scan

on:
  push:
    paths:
      - "scripts/scan-payanagent-demand.mjs"
      - ".github/workflows/payanagent-demand-scan.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Scan settled marketplace demand
        run: node scripts/scan-payanagent-demand.mjs
      - name: Persist demand evidence
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- revenue/payanagent-market-demand.json)" ]; then
            echo "No demand evidence change."
            exit 0
          fi
          git config user.name "PAL Revenue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add revenue/payanagent-market-demand.json
          git commit -m "revenue: snapshot settled PayanAgent demand"
          git push origin HEAD:main
