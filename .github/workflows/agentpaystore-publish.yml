name: Publish PAL to AgentPay Store

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentpaystore-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconcile AgentPay Store registration state
        run: node scripts/publish-agentpaystore.mjs

      - name: Persist sanitized listing receipts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- revenue/agentpaystore-listings.json)" ]; then
            echo "No listing metadata change."
            exit 0
          fi
          git config user.name "PAL Revenue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add revenue/agentpaystore-listings.json
          git commit -m "revenue: reconcile AgentPay Store listings"
          git pull --rebase origin main
          git push origin HEAD:main
