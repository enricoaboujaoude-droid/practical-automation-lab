name: Check PAL x402dash compatibility

on:
  push:
    paths:
      - ".github/workflows/register-x402dash.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether PAL endpoints are directly registerable
        shell: bash
        run: |
          set -euo pipefail

          check_endpoint() {
            local url="$1"
            local name="$2"

            status="$(curl --silent --show-error --output /tmp/pal-body.txt --write-out "%{http_code}" "$url" || true)"

            if [ "$status" = "402" ]; then
              echo "$name returns HTTP 402 to GET; attempting x402dash registration."
              payload="$(jq -nc --arg url "$url" '{url:$url}')"
              reg_status="$(curl --silent --show-error --output /tmp/x402dash-body.txt --write-out "%{http_code}"                 -X POST "https://api.x402dash.com/v1/register"                 -H "Content-Type: application/json"                 --data "$payload" || true)"
              echo "x402dash HTTP $reg_status"
              cat /tmp/x402dash-body.txt || true
              if [ "$reg_status" -ge 200 ] && [ "$reg_status" -lt 300 ]; then
                return 0
              fi
              echo "::warning::$name was not accepted by x402dash (HTTP $reg_status)."
              return 0
            fi

            echo "::notice::$name is POST-only and returns HTTP $status to GET; x402dash live verification requires a URL that itself returns HTTP 402, so registration is intentionally skipped."
          }

          check_endpoint "https://pal-nano-catalog-audit.onrender.com/v1/usdc/catalog-audit" "PAL Catalog Feed Identifier Audit"
          check_endpoint "https://pal-nano-catalog-audit.onrender.com/v1/usdc/gtin-check" "PAL GTIN Check"
          check_endpoint "https://pal-nano-catalog-audit.onrender.com/v1/usdc/feed-diff" "PAL Product Feed Diff"
          check_endpoint "https://pal-nano-catalog-audit.onrender.com/v1/usdc/x402-validate" "PAL x402 Declaration Validator"
