name: Register PAL seller on true402

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/register-true402.yml"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register and verify existing PAL x402 seller
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error             -X POST "https://true402.dev/api/v1/services"             -H "content-type: application/json"             --data '{"url":"https://pal-nano-catalog-audit.onrender.com"}')"
          printf '%s\n' "$response"
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ["RESPONSE"])
          assert data.get("id"), "true402 did not return a service id"
          assert data.get("url") == "https://pal-nano-catalog-audit.onrender.com", data
          manifest = data.get("manifest") or {}
          assert manifest.get("payment", {}).get("address") == "0x3D7718d5D868AF1Daae41D757244DE73DF72FB53", manifest
          assert manifest.get("endpoint") == "https://pal-nano-catalog-audit.onrender.com/v1/usdc/catalog-audit", manifest
          print(f"true402 registration verified: service_id={data['id']}")
          PY
