name: Publish PAL $25 Base Risk

on:
  push:
    paths:
      - ".github/workflows/publish-base-risk-25.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish verified $25 route to x402 buyer indexes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const origin="https://pal-base-risk-revenue.onrender.com";
          const resource=origin+"/v1/base-token-portfolio-rank";
          const wallet="0x02d1DAe81eAdDdeD344eeE43c6f31A8E166432bF";

          async function req(url, options={}){
            const response=await fetch(url,{
              ...options,
              headers:{accept:"application/json",...(options.body?{"content-type":"application/json"}:{}),...(options.headers||{})},
              signal:AbortSignal.timeout(45000)
            });
            const raw=await response.text();
            let body;
            try{body=raw?JSON.parse(raw):{};}catch{body={raw:raw.slice(0,1500)};}
            return {ok:response.ok,status:response.status,body};
          }

          let manifest=null;
          for(let i=0;i<18;i++){
            try{
              const r=await req(origin+"/.well-known/x402");
              if(r.ok && Array.isArray(r.body?.resources) &&
                 r.body.resources.some(x=>String(x.resource||"")===resource && Number(String(x.price||"").replace("$",""))===25)){
                manifest=r.body;
                break;
              }
            }catch{}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!manifest) throw new Error("canonical HTTPS x402 manifest not ready");

          const results={};

          results.market402=await req("https://market402.com/submit",{
            method:"POST",
            body:JSON.stringify({resource})
          });

          results.index402=await req("https://402index.io/api/v1/register",{
            method:"POST",
            body:JSON.stringify({
              url:resource,
              name:"PAL Base Token Portfolio Risk Rank",
              protocol:"x402",
              http_method:"POST",
              probe_body:JSON.stringify({
                addresses:[
                  "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",
                  "0x4200000000000000000000000000000000000006"
                ]
              }),
              description:"Rank 2-10 Base ERC-20 token contracts by deterministic security risk using live token-security evidence. Returns safety scores, risk bands, honeypot/trading/tax/source/proxy/concentration flags, and safest-to-riskiest ranking.",
              price_usd:25,
              payment_asset:"USDC",
              payment_network:"Base",
              category:"crypto/token-risk",
              provider:"Practical Automation Lab"
            })
          });

          results.true402=await req("https://true402.dev/api/v1/services/register",{
            method:"POST",
            body:JSON.stringify({url:origin})
          });

          results.agent402=await req("https://agent402.tools/api/index/register",{
            method:"POST",
            body:JSON.stringify({origin})
          });

          const sanitized=Object.fromEntries(Object.entries(results).map(([k,v])=>[
            k,{ok:v.ok,status:v.status,body:v.body}
          ]));
          console.log(JSON.stringify({origin,resource,price_usd:25,payout_wallet:wallet,results:sanitized},null,2));

          const accepted=Object.values(results).filter(r=>r.ok || r.status===409 ||
            /already|duplicate|exists|submitted|listed/i.test(JSON.stringify(r.body))).length;
          if(accepted<2) throw new Error("fewer than two buyer indexes accepted the $25 route");
          NODE
