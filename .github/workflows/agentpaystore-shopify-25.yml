name: Publish PAL $25 Shopify Audit to AgentStore

on:
  push:
    paths:
      - "scripts/publish-agentpaystore-shopify-25.mjs"
      - ".github/workflows/agentpaystore-shopify-25.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish $25 Shopify audit
        run: node scripts/publish-agentpaystore-shopify-25.mjs
      - name: Persist sanitized registration result
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- revenue/agentpaystore-shopify-25.json)" ]; then
            exit 0
          fi
          git config user.name "PAL Revenue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add revenue/agentpaystore-shopify-25.json
          git commit -m "revenue: persist AgentStore $25 Shopify listing"
          git pull --rebase origin main
          git push origin HEAD:main
