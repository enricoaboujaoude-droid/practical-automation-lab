name: Shopify App Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - "shopify-feed-health-app/RELEASE_REQUEST.md"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify-feed-health-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Install app dependencies
        run: npm install

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Verify deployment credentials are configured
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_APP_CLIENT_ID: ${{ secrets.SHOPIFY_APP_CLIENT_ID }}
        run: |
          : "${SHOPIFY_APP_AUTOMATION_TOKEN:?Missing SHOPIFY_APP_AUTOMATION_TOKEN repository secret}"
          : "${SHOPIFY_APP_CLIENT_ID:?Missing SHOPIFY_APP_CLIENT_ID repository secret}"

      - name: Prepare explicit production configuration
        env:
          SHOPIFY_APP_CLIENT_ID: ${{ secrets.SHOPIFY_APP_CLIENT_ID }}
        run: |
          cp shopify.app.toml shopify.app.production.toml
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'shopify.app.production.toml';
          const clientId = process.env.SHOPIFY_APP_CLIENT_ID;
          let config = fs.readFileSync(path, 'utf8');
          config = config.replace(/^client_id\s*=\s*"[^"]*"$/m, `client_id = "${clientId}"`);
          const expectedUrl = 'application_url = "https://pal-catalog-check-app.onrender.com"';
          if (!config.includes(expectedUrl)) {
            throw new Error('Production application_url is missing or incorrect.');
          }
          if (config.includes('https://example.com')) {
            throw new Error('Refusing to deploy placeholder example.com URL.');
          }
          fs.writeFileSync(path, config);
          console.log('Prepared explicit production Shopify configuration.');
          NODE

      - name: Deploy and release Shopify app configuration
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: >-
          shopify app deploy
          --config production
          --allow-updates
          --source-control-url "$COMMIT_URL"
