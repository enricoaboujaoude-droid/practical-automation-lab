name: PAL secret persistence probe

on:
  push:
    branches:
      - agentpact-revenue-once
    paths:
      - .github/workflows/agentpact-revenue-once.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify encrypted Actions secret persistence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s' 'pal-secret-probe' | gh secret set PAL_SECRET_TEST --repo "$GH_REPO"
          echo "SECRET_SET_OK"
          gh secret delete PAL_SECRET_TEST --repo "$GH_REPO"
          echo "SECRET_DELETE_OK"
