name: Publish PAL to PayanAgent

on:
  push:
    paths:
      - "scripts/publish-payanagent.mjs"
      - ".github/workflows/payanagent-marketplace-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: payanagent-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Register provider and publish dollar-priced offers
        run: node scripts/publish-payanagent.mjs

      - name: Persist public listing metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- revenue/payanagent-listing.json; then
            echo "No listing metadata change."
            exit 0
          fi
          git config user.name "PAL Revenue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add revenue/payanagent-listing.json
          git commit -m "revenue: publish PayanAgent marketplace offers"
          git push origin HEAD:main
