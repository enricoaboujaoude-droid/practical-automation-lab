name: Shopify Secrets Verify

on:
  push:
    paths:
      - ".github/workflows/shopify-secrets-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify-feed-health-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Verify secret presence
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_APP_CLIENT_ID: ${{ secrets.SHOPIFY_APP_CLIENT_ID }}
        run: |
          : "${SHOPIFY_APP_AUTOMATION_TOKEN:?Missing SHOPIFY_APP_AUTOMATION_TOKEN repository secret}"
          : "${SHOPIFY_APP_CLIENT_ID:?Missing SHOPIFY_APP_CLIENT_ID repository secret}"

      - name: Authenticate and create unreleased Shopify app version
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_APP_CLIENT_ID: ${{ secrets.SHOPIFY_APP_CLIENT_ID }}
        run: >-
          shopify app deploy
          --client-id "$SHOPIFY_APP_CLIENT_ID"
          --no-release
          --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
