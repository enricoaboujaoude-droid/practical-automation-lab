name: AgenticTrade provider revenue proof

on:
  push:
    paths:
      - "scripts/reconcile-agentictrade-provider.mjs"
      - ".github/workflows/agentictrade-provider-revenue.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Reconcile provider earnings without persisting credentials
        env:
          AGENTICTRADE_PROVIDER_TOKEN: ${{ secrets.AGENTICTRADE_PROVIDER_TOKEN }}
        run: node scripts/reconcile-agentictrade-provider.mjs
      - name: Persist sanitized revenue evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PAL Revenue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add revenue/agentictrade-provider-revenue.json
          git diff --cached --quiet && exit 0
          git commit -m "revenue: reconcile AgenticTrade provider earnings"
          git push origin HEAD:main
