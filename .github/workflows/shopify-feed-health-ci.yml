name: Shopify Feed Health CI

on:
  push:
    paths:
      - "shopify-feed-health-app/**"
      - ".github/workflows/shopify-feed-health-ci.yml"
  pull_request:
    paths:
      - "shopify-feed-health-app/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify-feed-health-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: shopify-feed-health-app/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
