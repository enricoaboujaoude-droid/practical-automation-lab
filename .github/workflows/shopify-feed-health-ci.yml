name: Shopify Feed Health CI

on:
  push:
    paths:
      - "shopify-feed-health-app/**"
      - ".github/workflows/shopify-feed-health-ci.yml"
  pull_request:
    paths:
      - "shopify-feed-health-app/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/pal_shopify_ci
    defaults:
      run:
        working-directory: shopify-feed-health-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
