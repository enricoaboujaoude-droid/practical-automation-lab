name: Shopify Feed Health CI

on:
  push:
    paths:
      - "shopify-feed-health-app/**"
      - ".github/workflows/shopify-feed-health-ci.yml"
  pull_request:
    paths:
      - "shopify-feed-health-app/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SESSION_STORE_URL: https://session-store.invalid/api/shopify-sessions
      SESSION_STORE_SECRET: ci-only-session-store-secret-1234567890
    defaults:
      run:
        working-directory: shopify-feed-health-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
