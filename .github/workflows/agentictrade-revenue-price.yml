name: Register PAL $20 AgenticTrade service

on:
  push:
    paths:
      - ".github/workflows/agentictrade-revenue-price.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register full-catalog remediation
        shell: bash
        run: |
          set -euo pipefail
          body='{"agent_name":"PAL Full Catalog Remediation","description":"Full-catalog ecommerce and Google Merchant Center remediation for up to 2,000 products in one paid call. Returns prioritized corrective actions for feed, identifier, GTIN, price, URL, brand/MPN and availability issues.","endpoint":"https://pal-full-catalog-remediation.onrender.com/v1/agentpay-remediation-bulk","price_per_call":"20","category":"data","tags":["ecommerce","merchant-center","catalog-remediation","shopify","gtin","product-feed"],"payment_method":"x402","free_tier_calls":0,"wallet_address":"0x02d1DAe81eAdDdeD344eeE43c6f31A8E166432bF","role":"provider"}'
          response="$(curl --fail-with-body --silent --show-error -X POST 'https://agentictrade.io/api/v1/agents/onboard' -H 'content-type: application/json' --data "$body")"
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ["RESPONSE"])
          safe={
            "agent_id": data.get("agent_id"),
            "service_id": data.get("service_id"),
            "provider_id": data.get("provider_id"),
            "owner_binding_status": data.get("owner_binding_status"),
            "service": data.get("service"),
          }
          assert safe["agent_id"], data
          assert safe["service_id"], data
          print(json.dumps(safe, indent=2, sort_keys=True))
          PY
