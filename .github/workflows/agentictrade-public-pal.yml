name: AgenticTrade public PAL usage

on:
  push:
    paths:
      - "scripts/scan-agentictrade-public-pal.mjs"
      - ".github/workflows/agentictrade-public-pal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Scan public PAL service usage
        run: node scripts/scan-agentictrade-public-pal.mjs
      - name: Persist public evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PAL Revenue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add revenue/agentictrade-public-pal-services.json
          git diff --cached --quiet && exit 0
          git commit -m "revenue: snapshot public AgenticTrade PAL usage"
          git push origin HEAD:main
