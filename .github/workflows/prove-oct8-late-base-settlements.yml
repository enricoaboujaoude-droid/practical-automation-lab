name: Prove Oct8 late Base settlements

on:
  push:
    paths:
      - "scripts/prove-oct8-late-base-settlements.mjs"
      - ".github/workflows/prove-oct8-late-base-settlements.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Scan late Base settlement window
        run: node scripts/prove-oct8-late-base-settlements.mjs
      - name: Persist proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PAL Revenue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add revenue/oct8-late-base-settlements.json
          git diff --cached --quiet && exit 0
          git commit -m "revenue: record late Oct 8 Base settlements"
          git push origin HEAD:main
