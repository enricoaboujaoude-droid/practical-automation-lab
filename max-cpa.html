<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maximum CPA Calculator</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:860px;margin:40px auto;padding:0 18px;line-height:1.5}h1{margin-bottom:6px}.muted{opacity:.72}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:18px 0}label{display:block;font-weight:650;margin-bottom:5px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:8px;font-size:16px}button{padding:12px 16px;border:0;border-radius:9px;font-weight:700;cursor:pointer;margin-top:15px}.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{border:1px solid #ddd;border-radius:10px;padding:12px}.result b{display:block;font-size:1.3rem;margin-top:4px}.note{font-size:.92rem;opacity:.78}@media(max-width:650px){.grid,.results{grid-template-columns:1fr}}</style></head><body><h1>Maximum CPA Calculator</h1><p class="muted">Find the most you can pay to acquire an order while preserving a target profit.</p><div class="card"><div class="grid"><div><label>Average order value ($)</label><input id="aov" type="number" value="100" min="0"></div><div><label>COGS ($)</label><input id="cogs" type="number" value="35" min="0"></div><div><label>Shipping + fulfillment ($)</label><input id="ship" type="number" value="12" min="0"></div><div><label>Payment/platform fee (%)</label><input id="fee" type="number" value="3" min="0"></div><div><label>Other variable cost/order ($)</label><input id="other" type="number" value="3" min="0"></div><div><label>Target profit/order ($)</label><input id="target" type="number" value="15" min="0"></div></div><button onclick="calc()">Calculate</button></div><div class="card"><div class="results"><div class="result">Contribution before ads<b id="contrib">—</b></div><div class="result">Maximum CPA at break-even<b id="be">—</b></div><div class="result">Maximum CPA at target profit<b id="targetcpa">—</b></div><div class="result">Equivalent target ROAS<b id="roas">—</b></div></div></div><script>const n=id=>parseFloat(document.getElementById(id).value)||0;const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v);function calc(){let a=n('aov');let variable=n('cogs')+n('ship')+n('other')+a*n('fee')/100;let c=a-variable;let t=Math.max(0,c-n('target'));document.getElementById('contrib').textContent=money(c);document.getElementById('be').textContent=money(Math.max(0,c));document.getElementById('targetcpa').textContent=money(t);document.getElementById('roas').textContent=t>0?(a/t).toFixed(2)+'x':'Target impossible'}calc();</script></body></html>
