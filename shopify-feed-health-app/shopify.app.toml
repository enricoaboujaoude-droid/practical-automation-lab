# Practical Automation Lab — PAL Catalog Check
# Production configuration for the Partner-owned public Shopify app.
client_id = ""
name = "PAL Catalog Check"
application_url = "https://pal-shopify-feed-health.onrender.com"
embedded = true

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [
  "https://pal-shopify-feed-health.onrender.com/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
