<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automation Payback Calculator</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:860px;margin:40px auto;padding:0 18px;line-height:1.5}h1{margin-bottom:6px}.muted{opacity:.72}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{border:1px solid #ddd;border-radius:14px;padding:18px;margin:18px 0}label{display:block;font-weight:650;margin-bottom:5px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:8px;font-size:16px}button{padding:12px 16px;border:0;border-radius:9px;font-weight:700;cursor:pointer;margin-top:15px}.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{border:1px solid #ddd;border-radius:10px;padding:12px}.result b{display:block;font-size:1.3rem;margin-top:4px}.note{font-size:.92rem;opacity:.78}@media(max-width:650px){.grid,.results{grid-template-columns:1fr}}</style></head><body><h1>Automation Payback Calculator</h1><p class="muted">See how long an automation takes to repay its setup cost after recurring costs.</p><div class="card"><div class="grid"><div><label>One-time implementation cost ($)</label><input id="setup" type="number" value="2000" min="0"></div><div><label>Monthly gross savings/value ($)</label><input id="gross" type="number" value="800" min="0"></div><div><label>Monthly software/API cost ($)</label><input id="run" type="number" value="120" min="0"></div><div><label>Annual maintenance cost ($)</label><input id="maint" type="number" value="600" min="0"></div></div><button onclick="calc()">Calculate</button></div><div class="card"><div class="results"><div class="result">Net monthly benefit<b id="netm">—</b></div><div class="result">Payback period<b id="pb">—</b></div><div class="result">Year 1 net value<b id="y1">—</b></div><div class="result">3-year net value<b id="y3">—</b></div><div class="result">Year 1 ROI on setup cost<b id="roi">—</b></div></div></div><script>const n=id=>parseFloat(document.getElementById(id).value)||0;const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v);function calc(){let monthly=n('gross')-n('run')-n('maint')/12;let pb=monthly>0?(n('setup')===0?'Immediate':(n('setup')/monthly).toFixed(1)+' months'):'No positive payback';let y1=monthly*12-n('setup');let y3=monthly*36-n('setup');let roi=n('setup')>0?y1/n('setup')*100:null;document.getElementById('netm').textContent=money(monthly);document.getElementById('pb').textContent=pb;document.getElementById('y1').textContent=money(y1);document.getElementById('y3').textContent=money(y3);document.getElementById('roi').textContent=roi===null?'n/a':roi.toFixed(0)+'%'}calc();</script></body></html>
